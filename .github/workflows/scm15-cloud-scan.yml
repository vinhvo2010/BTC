name: SCM SHADOW closed-bar journal
on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scm15-cloud-scan.yml'
      - 'terminal/**'

permissions:
  contents: write

concurrency:
  group: scm15-cloud-readonly
  cancel-in-progress: false

jobs:
  scan:
    name: Persist BTC and ENA decisions across six native frames
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify reviewed scanner and execution lock
        working-directory: terminal
        run: |
          npm test
          npm run check
          node scripts/build-release.mjs --check
      - name: Read and persist public SHADOW assessment
        id: scan
        env:
          SCM_TERMINAL_URL: https://skydeal.app/api/live
        run: node terminal/scripts/cloud-scan.mjs
      - name: Publish heartbeat, immutable scan and decision journal
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name "SCM SHADOW Journal"
          git config user.email "scm15@users.noreply.github.com"
          git add data/scm15
          if ! git diff --cached --quiet; then
            git commit -m "data(scm15): persist SHADOW decisions and scan evidence"
            git push origin HEAD:main
          fi
