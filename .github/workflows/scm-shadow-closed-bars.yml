name: SCM SHADOW resident native-bar worker
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Bounded worker session before automatic handoff"
        required: false
        default: '300'
  push:
    branches: [main]
    paths:
      - '.github/workflows/scm-shadow-closed-bars.yml'
      - 'terminal/**'
permissions:
  contents: write
  actions: write
concurrency:
  group: scm15-cloud-readonly
  cancel-in-progress: true
jobs:
  scan:
    name: Timed SHADOW capture and durable decisions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify reviewed scanner and execution lock
        working-directory: terminal
        run: |
          npm test
          npm run check
          node scripts/build-release.mjs --check
      - name: Run independent SHADOW timer
        env:
          SCM_TERMINAL_URL: https://skydeal.app/api/live
          SCM_SESSION_MINUTES: ${{ github.event_name == 'push' && '1' || inputs.session_minutes || '300' }}
        run: node terminal/scripts/resident-scan.mjs
      - name: Hand off safely to the next bounded session
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scm-shadow-closed-bars.yml --repo vinhvo2010/BTC --ref main -f session_minutes=300
          echo "HANDOFF_REQUESTED"
      - name: Preserve the last public scan on a publication failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-recovery-${{ github.run_id }}
          path: terminal/evidence/last-scan
          retention-days: 30
          if-no-files-found: ignore
